# Builds gitcraft for Windows and Linux and publishes a GitHub release when a `v*` tag is pushed.
# Run it by hand (Actions › Release › Run workflow) to only build and download the artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          # The oldest supported runner, so the binary runs on older glibc too.
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libdbus-1-dev pkg-config

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "gitcraft-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/gitcraft.exe, README.md, ATTRIBUTION.md, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" "/DOutputName=gitcraft-${{ github.ref_name }}-${{ matrix.name }}-setup" packaging\windows\gitcraft.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist\*.exe .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="gitcraft-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/gitcraft README.md ATTRIBUTION.md LICENSE-MIT LICENSE-APACHE \
            packaging/gitcraft.desktop "$dir/"
          cp assets/app-icon/gitcraft-256.png "$dir/gitcraft.png"
          strip "$dir/gitcraft"
          tar czf "$dir.tar.gz" "$dir"

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          # The runner has no FUSE: appimagetool unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          sh packaging/linux/build-appimage.sh "gitcraft-${{ github.ref_name }}-${{ matrix.name }}.AppImage"

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: deb and rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          name="gitcraft-${{ github.ref_name }}-${{ matrix.name }}"
          strip target/release/gitcraft
          cargo deb --no-build --output "$name.deb"
          cargo generate-rpm --output "$name.rpm"
          # The .deb installs, with its menu entry and icon; the .rpm holds the same files.
          sudo apt-get install -y desktop-file-utils rpm "./$name.deb"
          desktop-file-validate /usr/share/applications/gitcraft.desktop
          test -x /usr/bin/gitcraft
          test -f /usr/share/icons/hicolor/256x256/apps/gitcraft.png
          rpm -qp --requires "$name.rpm"
          rpm -qlp "$name.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: gitcraft-${{ matrix.name }}
          path: |
            gitcraft-*.zip
            gitcraft-*.tar.gz
            gitcraft-*-setup.exe
            gitcraft-*.AppImage
            gitcraft-*.deb
            gitcraft-*.rpm

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
